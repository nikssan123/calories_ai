# Production stack for the always-on host. Mirrors how the trading bot is hosted
# on this VPS: no published ports, containers join the shared external `web`
# network under explicit aliases, and the Caddy that already runs there
# terminates TLS. Caddy routes daysofar.com to the web container and
# api.daysofar.com to the api container — the phone apps carry a bearer token
# and call the API directly rather than through the web app's proxy.
#
# Create the shared network once per host, before the first `up`:
#   docker network create web
#
#   docker compose -f docker-compose.prod.yml up -d

# Pinned so it can never collide with docker-compose.yml in this same directory.
name: calorytracker

networks:
  # Shared with the other projects on this host. The web and api containers join
  # it so Caddy can route to each on its own hostname.
  web:
    external: true
    name: web
  # Private to this stack. Postgres is only ever on here, so nothing outside the
  # stack can reach the database however it is addressed.
  internal:
    driver: bridge

services:
  db:
    image: postgres:17-alpine
    container_name: calorytracker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ct}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-calorytracker}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ct} -d ${POSTGRES_DB:-calorytracker}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Rate-limit counters shared across API replicas.
  #
  # This is what makes a per-account ceiling mean one number rather than one per
  # replica. It is only load-bearing once `api` is scaled past one; a
  # single-container deployment can drop the service and REDIS_URL together and
  # the limiter keeps its counters in process.
  #
  # `internal` only — like the database, and for a stronger reason: Redis has no
  # authentication configured here, so its whole security model is that nothing
  # outside this stack can address it.
  #
  # No volume, and snapshots off. Everything in here is a counter with a TTL of
  # minutes; persisting it would preserve nothing worth having, and restoring a
  # spent hour's counts into a fresh hour is worse than starting empty.
  redis:
    image: redis:8-alpine
    container_name: calorytracker-redis
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      # Counters are pure cache, so a full instance should evict rather than
      # start refusing writes — which, with `skipOnError`, would otherwise turn
      # into a limiter that has silently stopped limiting.
      - --maxmemory
      - ${REDIS_MAXMEMORY:-128mb}
      - --maxmemory-policy
      - allkeys-lru
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: calorytracker-api:latest
    container_name: calorytracker-api
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

    environment:
      TZ: ${TZ:-Europe/Sofia}
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-ct}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-calorytracker}
      # Where the rate limiter keeps its counters. Required the moment `api` is
      # scaled past one replica: without it each replica enforces the full
      # ceiling by itself, so three replicas serve three times the turns an
      # account is entitled to, and nothing anywhere says so.
      REDIS_URL: redis://redis:6379
      # Served over HTTPS by Caddy, so session cookies must carry Secure.
      SECURE_COOKIES: "true"
      # Close registration once your own account exists. The very first account
      # is always permitted regardless, or the deployment would be unusable.
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
      # Who may open /admin, comma-separated. Empty falls back to the oldest
      # account, which is right for a personal install; naming addresses here
      # replaces that fallback rather than adding to it, so an address that does
      # not match an existing account leaves nobody holding the panel.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # Optional: bill per token instead of using the subscription login below.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Where a link in an email has to point. This is the *web* address, not
      # the API's: a mail client cannot do anything useful with api.daysofar.com.
      APP_URL: ${APP_URL:-https://daysofar.com}
      # Transactional email. Leave RESEND_API_KEY unset and the server logs each
      # message instead of sending it — the deployment stays fully working, it
      # just stops being able to reset a forgotten password. EMAIL_FROM must be
      # on a domain verified with Resend; the sandbox sender only ever delivers
      # to the address that owns the account.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Day So Far <notifications@daysofar.com>}
      # Replies land in the support inbox rather than at the sending address.
      # Several of these messages end with "reply to this email", so this has to
      # be an address that is actually received — see RESEND_WEBHOOK_SECRET.
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-support@daysofar.com}
      # Signs the inbound webhook, from the Resend webhooks dashboard. Unset
      # means POST /email/inbound refuses everything, which is the only safe
      # default for a public endpoint whose whole authentication is a signature.
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      # Signing in with Google. Both halves or the button is not offered at all,
      # which is the right default here: this stack has no way to guess a client
      # registered against its own callback URL. The OAuth client in the Google
      # console must list https://daysofar.com/api/auth/google/callback among its
      # redirect URIs — the *web* address, because the callback's job is to set
      # the session cookie and a cookie set on api.daysofar.com never reaches the
      # app. That URL is also what APP_URL derives by default, so the third
      # variable stays empty unless the web app moves somewhere APP_URL does not
      # describe.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      # Caddy reaches this over the private Docker network, so X-Forwarded-For is
      # believed only when the immediate peer is a private address. Without it
      # the rate limiter sees Caddy on every request and buckets the whole
      # internet together; with a bare "true" any caller could name its own IP.
      TRUST_PROXY: "uniquelocal"
      # Browser origins allowed to call this API with credentials. The native
      # apps are absent on purpose: they send no Origin and CORS never applies.
      WEB_ORIGINS: ${WEB_ORIGINS:-https://daysofar.com}

    volumes:
      # Claude's OAuth token, written once by `claude login`. A named volume so
      # the login survives image rebuilds — same approach as the trading bot.
      - claude-home:/home/node
      # Meal photos are on disk, not in Postgres; they must outlive the image.
      - uploads:/app/apps/api/uploads

    # On `web` so Caddy can route api.daysofar.com straight here. The mobile
    # apps hold a bearer token and call the API directly — the Next proxy is a
    # cookie relay for the browser and forwards no Authorization header, so
    # there is no route to this service through the web container.
    #
    # The database stays off `web` regardless. What this does expose is the API
    # itself to the other containers on that shared network, which is the same
    # reach the public internet now has: every route but /health, /auth/ and
    # signed /photos/ requires a session.
    networks:
      internal:
      web:
        aliases: [calorytracker-api]

    # Claude Code can spike well past its usual footprint. Without a cap an
    # unlucky spike gets a neighbouring project's container OOM-killed instead.
    mem_limit: 2g
    memswap_limit: 2g
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: calorytracker-web:latest
    container_name: calorytracker-web
    restart: unless-stopped
    depends_on: [api]

    environment:
      TZ: ${TZ:-Europe/Sofia}
      NODE_ENV: production
      # Server-side only: the browser calls the Next proxy at /api on its own
      # origin, which forwards here over the private network.
      API_INTERNAL_URL: http://api:4000

    # The only container on the shared network. The alias is spelled out because
    # `web` is far too generic for a network shared with other projects.
    networks:
      internal:
      web:
        aliases: [calorytracker-web]

    # No published port: Caddy reaches it over `web`, so the VPS never opens a
    # port to the internet for this. Uncomment only for local debugging.
    # ports:
    #   - "127.0.0.1:3000:3000"

    mem_limit: 512m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  pgdata:
  claude-home:
  uploads:
