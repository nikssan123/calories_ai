# Production stack for the always-on host. Mirrors how the trading bot is hosted
# on this VPS: no published ports, containers join the shared external `web`
# network under explicit aliases, and the Caddy that already runs there
# terminates TLS. Caddy routes daysofar.com to the web container and
# api.daysofar.com to the api container — the phone apps carry a bearer token
# and call the API directly rather than through the web app's proxy.
#
# Create the shared network once per host, before the first `up`:
#   docker network create web
#
#   docker compose -f docker-compose.prod.yml up -d

# Pinned so it can never collide with docker-compose.yml in this same directory.
name: calorytracker

networks:
  # Shared with the other projects on this host. The web and api containers join
  # it so Caddy can route to each on its own hostname.
  web:
    external: true
    name: web
  # Private to this stack. Postgres is only ever on here, so nothing outside the
  # stack can reach the database however it is addressed.
  internal:
    driver: bridge

services:
  db:
    image: postgres:17-alpine
    container_name: calorytracker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ct}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-calorytracker}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ct} -d ${POSTGRES_DB:-calorytracker}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Rate-limit counters shared across API replicas.
  #
  # This is what makes a per-account ceiling mean one number rather than one per
  # replica. It is only load-bearing once `api` is scaled past one; a
  # single-container deployment can drop the service and REDIS_URL together and
  # the limiter keeps its counters in process.
  #
  # `internal` only — like the database, and for a stronger reason: Redis has no
  # authentication configured here, so its whole security model is that nothing
  # outside this stack can address it.
  #
  # No volume, and snapshots off. Everything in here is a counter with a TTL of
  # minutes; persisting it would preserve nothing worth having, and restoring a
  # spent hour's counts into a fresh hour is worse than starting empty.
  redis:
    image: redis:8-alpine
    container_name: calorytracker-redis
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      # Counters are pure cache, so a full instance should evict rather than
      # start refusing writes — which, with `skipOnError`, would otherwise turn
      # into a limiter that has silently stopped limiting.
      - --maxmemory
      - ${REDIS_MAXMEMORY:-128mb}
      - --maxmemory-policy
      - allkeys-lru
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: calorytracker-api:latest
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

    # How many API containers. A variable rather than a literal, and defaulting
    # to one, because the safe value depends on which lane this deployment runs
    # and the unsafe direction is the one you cannot see from here:
    #
    #   * `AI_PROVIDER=anthropic-api` (the product's lane) — scale freely. It
    #     spawns no subprocess and holds nothing between turns.
    #   * `AI_PROVIDER=anthropic`, which is also what an unset AI_PROVIDER
    #     means — leave it at 1. Both replicas would mount the same
    #     `claude-home` volume and run their own `claude` against one
    #     `.credentials.json`, and two processes refreshing one OAuth token is
    #     a way to lose it. This is the default precisely because it is also
    #     the default provider.
    #
    # Set API_REPLICAS=2 in the host's .env once the deployment is on the API
    # lane. Declared here rather than passed as `--scale` so the topology is a
    # property of the deployment rather than of somebody's shell history.
    #
    # Two more things have to be true before raising it, both of which are:
    # photos must be in a bucket (S3_* set), or they land on a per-container
    # volume and a photo taken on one replica 404s from the other; and
    # REDIS_URL must be set, or each replica enforces the whole rate limit by
    # itself. The API's own environment below wires Redis unconditionally.
    #
    # No `container_name` above, for a related reason: Docker will not create
    # two containers with one name, so naming this service pins it to one
    # replica for good. `calorytracker-api` survives as the network alias
    # below, which is what Caddy and the web container actually address — every
    # replica answers to it and Docker's DNS round-robins between them.
    #
    # The scheduler runs in every replica and that is fine: each hourly pass
    # takes a Postgres advisory lock, so exactly one of them does the work.
    # Migrations do the same on boot — see `src/migrate.ts` — so replicas
    # starting together queue rather than race.
    deploy:
      replicas: ${API_REPLICAS:-1}

    environment:
      TZ: ${TZ:-Europe/Sofia}
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-ct}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-calorytracker}
      # Where the rate limiter keeps its counters. Required the moment `api` is
      # scaled past one replica: without it each replica enforces the full
      # ceiling by itself, so three replicas serve three times the turns an
      # account is entitled to, and nothing anywhere says so.
      REDIS_URL: redis://redis:6379
      # Served over HTTPS by Caddy, so session cookies must carry Secure.
      SECURE_COOKIES: "true"
      # Close registration once your own account exists. The very first account
      # is always permitted regardless, or the deployment would be unusable.
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
      # Who may open /admin, comma-separated. Empty falls back to the oldest
      # account, which is right for a personal install; naming addresses here
      # replaces that fallback rather than adding to it, so an address that does
      # not match an existing account leaves nobody holding the panel.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # Optional: bill per token instead of using the subscription login. On its
      # own this does NOT switch lanes — the Agent SDK picks it up in preference
      # to the subscription and still spawns a subprocess. AI_PROVIDER below is
      # what chooses.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # ---- forwarded from the host's .env, not defaulted here -----------------
      #
      # Everything below is written as a bare `KEY:`, which is compose's
      # pass-through form: the value comes from the host's .env, and when it is
      # not set there the variable is left out of the container altogether so
      # the default in the code applies. That is the whole point of the form.
      #
      # `KEY: ${KEY:-}` — the shape used above for keys and addresses — would be
      # wrong for these. It sets the variable to an empty string, and an empty
      # string is a value: `AI_PROVIDER=` fails the check in
      # `ai/providers/index.ts` and takes the API down at boot, and an empty
      # OPENAI_MODEL is a request for a model named "". The keys above survive
      # it only because each is read as "absent or falsy means off".
      #
      # These have to be forwarded at all because there is no `env_file:` here
      # and .env is in .dockerignore: a variable set only in the host's .env
      # reaches compose's substitution and never reaches the process.

      # Which lane runs the journal: `anthropic` (the subscription login above,
      # and what an absent value means), `anthropic-api`, or `openai`. Without
      # this line the lane change in SCALING.md appears to work and changes
      # nothing — the deployment stays on the subscription, silently.
      AI_PROVIDER:
      # The exceptions to it, comma-separated: addresses whose turns run on the
      # Claude Code subscription instead of the metered key. Empty — the default
      # — means every turn is billed. It can only ever move somebody *onto* the
      # subscription, so it is inert on a deployment already running `anthropic`
      # for everyone. The `claude-home` volume below is what it depends on: with
      # no `.credentials.json` on it a listed address is left on the metered
      # lane, silently, which is the failure this setting has. `/health` names
      # both credentials, so it is the one place to check the login is there.
      #
      # It lifts the plan meters as well as moving the lane — a ceiling in
      # plans.ts is a dollar figure and a subscription turn spends none — so a
      # listed address has no paywall on any of the five sold dimensions.
      #
      # Non-empty means API_REPLICAS must stay at 1, whatever AI_PROVIDER says.
      # Every replica runs its own `claude` against this one shared credentials
      # file, and two of them refreshing one OAuth token is how a login is lost.
      SUBSCRIPTION_EMAILS:
      # The input-tokens-per-minute ceiling the key is entitled to, which is what
      # arms the token bucket. Absent means ungoverned: right for the
      # subscription lane, wrong the moment ANTHROPIC_API_KEY starts paying.
      # Setting the key without this is the one mistake SCALING.md names.
      ANTHROPIC_ITPM:
      # How long a written cache entry lives: `5m` (default) or `1h`. The hour
      # doubles the write price, so it is worth having only once turns cluster
      # inside an hour but not inside five minutes — read the cold-write share
      # off `ai_usage` before changing it. Anything else fails at boot.
      ANTHROPIC_CACHE_TTL:
      # The third lane, in full. Each of these is read with its own default in
      # `ai/providers/openai.ts`, so a missing line here is not an error — it is
      # the default, silently, however carefully the host's .env was written.
      OPENAI_API_KEY:
      OPENAI_BASE_URL:
      OPENAI_MODEL:
      OPENAI_MODEL_TEXT:
      OPENAI_MODEL_VISION:
      OPENAI_MODEL_SETUP:
      OPENAI_MODEL_REVIEW:
      OPENAI_MODEL_RECIPE:
      OPENAI_MODEL_NUDGE:
      OPENAI_MODEL_PLAN:
      OPENAI_PRICE_INPUT:
      OPENAI_PRICE_OUTPUT:
      # USDA FoodData Central, which answers the American branded half of a
      # barcode lookup. Absent means Open Food Facts only — a working
      # configuration, not a broken one.
      FDC_API_KEY:
      # Sent to Open Food Facts on every request. The default is built from
      # APP_URL and is already correct here; this exists so it can be changed
      # without a rebuild.
      BARCODE_USER_AGENT:
      # Pino's level. Absent means `info`.
      LOG_LEVEL:
      # Postgres pool size per replica, default 10. Worth a look before
      # API_REPLICAS goes up: the ceiling is this times the replica count.
      DATABASE_POOL_MAX:
      # Where a link in an email has to point. This is the *web* address, not
      # the API's: a mail client cannot do anything useful with api.daysofar.com.
      APP_URL: ${APP_URL:-https://daysofar.com}
      # Transactional email. Leave RESEND_API_KEY unset and the server logs each
      # message instead of sending it — the deployment stays fully working, it
      # just stops being able to reset a forgotten password. EMAIL_FROM must be
      # on a domain verified with Resend; the sandbox sender only ever delivers
      # to the address that owns the account.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Day So Far <notifications@daysofar.com>}
      # Replies land in the support inbox rather than at the sending address.
      # Several of these messages end with "reply to this email", so this has to
      # be an address that is actually received — see RESEND_WEBHOOK_SECRET.
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-support@daysofar.com}
      # Signs the inbound webhook, from the Resend webhooks dashboard. Unset
      # means POST /email/inbound refuses everything, which is the only safe
      # default for a public endpoint whose whole authentication is a signature.
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      # The shared secret RevenueCat sends as the `Authorization` header on its
      # webhook, set on their dashboard next to the URL. Unset means
      # POST /billing/revenuecat refuses everything, which is the only safe
      # default: the endpoint is public and the body names an account and a
      # tier, so anybody who finds the path could otherwise grant themselves
      # Coach forever. Absent from this file until now, which meant a secret set
      # in .env never reached the container and every purchase was a silent
      # no-op.
      REVENUECAT_WEBHOOK_SECRET: ${REVENUECAT_WEBHOOK_SECRET:-}
      # Whether to honour purchases the store marks SANDBOX. Off in production
      # by default and it should stay off — a sandbox purchase costs nothing, so
      # accepting one here is a free Coach plan for anybody with a tester
      # account. Set it true only to prove the webhook end to end, then unset.
      BILLING_ACCEPT_SANDBOX: ${BILLING_ACCEPT_SANDBOX:-}
      # Signing in with Google. Both halves or the button is not offered at all,
      # which is the right default here: this stack has no way to guess a client
      # registered against its own callback URL. The OAuth client in the Google
      # console must list https://daysofar.com/api/auth/google/callback among its
      # redirect URIs — the *web* address, because the callback's job is to set
      # the session cookie and a cookie set on api.daysofar.com never reaches the
      # app. That URL is also what APP_URL derives by default, so the third
      # variable stays empty unless the web app moves somewhere APP_URL does not
      # describe.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      # Caddy reaches this over the private Docker network, so X-Forwarded-For is
      # believed only when the immediate peer is a private address. Without it
      # the rate limiter sees Caddy on every request and buckets the whole
      # internet together; with a bare "true" any caller could name its own IP.
      TRUST_PROXY: "uniquelocal"
      # Browser origins allowed to call this API with credentials. The native
      # apps are absent on purpose: they send no Origin and CORS never applies.
      WEB_ORIGINS: ${WEB_ORIGINS:-https://daysofar.com}
      # Meal photos in a bucket instead of on the volume below. Unset and they
      # stay local, which works perfectly for one replica and not at all for
      # two — a photo on one container's disk is a permanent 404 from the other.
      # All four together or the API refuses to boot; see .env.example.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_REGION: ${S3_REGION:-auto}

    volumes:
      # Claude's OAuth token, written once by `claude login`. A named volume so
      # the login survives image rebuilds — same approach as the trading bot.
      - claude-home:/home/node
      # Meal photos are on disk, not in Postgres; they must outlive the image.
      # Stays mounted even with S3_* configured: the bucket only takes new
      # photos, and everything written before the switch is still in here.
      - uploads:/app/apps/api/uploads

    # On `web` so Caddy can route api.daysofar.com straight here. The mobile
    # apps hold a bearer token and call the API directly — the Next proxy is a
    # cookie relay for the browser and forwards no Authorization header, so
    # there is no route to this service through the web container.
    #
    # The database stays off `web` regardless. What this does expose is the API
    # itself to the other containers on that shared network, which is the same
    # reach the public internet now has: every route but /health, /auth/ and
    # signed /photos/ requires a session.
    networks:
      internal:
      web:
        aliases: [calorytracker-api]

    # Claude Code can spike well past its usual footprint. Without a cap an
    # unlucky spike gets a neighbouring project's container OOM-killed instead.
    #
    # Per replica, so budget it twice against the host. It is sized for the
    # subscription lane's subprocess; the API lane spawns nothing and runs in a
    # fraction of it, which is worth remembering if this host ever gets tight.
    mem_limit: 2g
    memswap_limit: 2g
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: calorytracker-web:latest
    container_name: calorytracker-web
    restart: unless-stopped
    depends_on: [api]

    environment:
      TZ: ${TZ:-Europe/Sofia}
      NODE_ENV: production
      # Server-side only: the browser calls the Next proxy at /api on its own
      # origin, which forwards here over the private network.
      API_INTERNAL_URL: http://api:4000

    # The only container on the shared network. The alias is spelled out because
    # `web` is far too generic for a network shared with other projects.
    networks:
      internal:
      web:
        aliases: [calorytracker-web]

    # No published port: Caddy reaches it over `web`, so the VPS never opens a
    # port to the internet for this. Uncomment only for local debugging.
    # ports:
    #   - "127.0.0.1:3000:3000"

    mem_limit: 512m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  pgdata:
  claude-home:
  uploads:
